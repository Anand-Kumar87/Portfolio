<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <rect width="800" height="500" fill="url(#grid)" />

  <!-- Glowing background circles -->
  <circle cx="250" cy="200" r="140" fill="#6366f1" opacity="0.15" />
  <circle cx="550" cy="300" r="120" fill="#ec4899" opacity="0.12" />

  <!-- Code window frame -->
  <g transform="translate(180, 100)">
    <rect width="440" height="280" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    
    <rect width="440" height="42" rx="16" fill="rgba(30, 41, 59, 0.8)" />
    <rect y="26" width="440" height="16" fill="rgba(30, 41, 59, 0.8)" />
    <line x1="0" y1="42" x2="440" y2="42" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

    <circle cx="24" cy="21" r="6" fill="#ef4444" opacity="0.8" />
    <circle cx="44" cy="21" r="6" fill="#f59e0b" opacity="0.8" />
    <circle cx="64" cy="21" r="6" fill="#10b981" opacity="0.8" />

    <g transform="translate(180, 80)">
      <rect x="-10" y="-10" width="100" height="100" rx="20" fill="url(#accentGrad)" opacity="0.2" />
      <path d="M 22 25 L 8 40 L 22 55" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 58 25 L 72 40 L 58 55" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="46" y1="22" x2="34" y2="58" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" />
    </g>

    <text x="220" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#f8fafc" text-anchor="middle">
      Project Preview
    </text>
    <text x="220" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
      Modern Web Application
    </text>
  </g>
</svg>
